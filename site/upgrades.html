<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Caipora — Aprimoramentos do Cachimbo</title>
  <link rel="icon" type="image/png" href="assets/sprites/brand_mark.png">
  <style>
    @font-face {
      font-family: "PressStart2P";
      src: url("assets/fonts/PressStart2P.ttf") format("truetype");
      font-display: swap;
    }
    :root {
      --bg: #050505;
      --panel: #0e0d0d;
      --line: #2a1414;
      --blood: #b41818;
      --ember: #e8731f;
      --ink: #d8cfca;
      --muted: #7e7470;
      --green: #4fae54;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font-family: "Courier New", monospace; line-height: 1.4;
      background-image: radial-gradient(circle at 50% -10%, #1a0808 0%, #050505 60%);
      min-height: 100vh;
    }
    h1, h2, .pix { font-family: "PressStart2P", monospace; }
    a { color: var(--ember); }
    header {
      padding: 22px 18px; border-bottom: 1px solid var(--line);
      display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    }
    header h1 { font-size: 15px; margin: 0; color: var(--blood); letter-spacing: 1px; }
    header nav { display: flex; gap: 12px; }
    header nav a { font-size: 11px; color: var(--muted); text-decoration: none; }
    header nav a:hover { color: var(--ember); }
    .wrap { max-width: 980px; margin: 0 auto; padding: 18px; }

    /* ---- login ---- */
    #login {
      position: fixed; inset: 0; background: rgba(5,5,5,.96);
      display: flex; align-items: center; justify-content: center; z-index: 50;
    }
    #login .box {
      width: min(360px, 92vw); background: var(--panel);
      border: 1px solid var(--line); padding: 26px;
    }
    #login h2 { font-size: 12px; color: var(--blood); margin: 0 0 18px; }
    label { display: block; font-size: 11px; color: var(--muted); margin: 14px 0 5px; text-transform: uppercase; letter-spacing: 1px; }
    input[type=text], input[type=password], input[type=number] {
      width: 100%; background: #000; color: var(--ink);
      border: 1px solid var(--line); padding: 9px 10px; font-family: inherit; font-size: 14px;
    }
    input:focus { outline: none; border-color: var(--ember); }
    .chk { display: flex; align-items: center; gap: 8px; margin-top: 14px; color: var(--muted); font-size: 12px; }
    button {
      font-family: "PressStart2P", monospace; font-size: 10px; cursor: pointer;
      background: var(--blood); color: #fff; border: none; padding: 12px 14px; letter-spacing: 1px;
    }
    button:hover { background: var(--ember); }
    button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
    button.ghost:hover { color: var(--ink); border-color: var(--ember); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .err { color: var(--blood); font-size: 12px; margin-top: 12px; min-height: 16px; }

    /* ---- trilhas ---- */
    .trilha-title {
      font-size: 12px; color: var(--ember); margin: 28px 0 12px;
      border-bottom: 1px solid var(--line); padding-bottom: 8px;
      font-family: "PressStart2P", monospace;
    }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
    .card {
      background: var(--panel); border: 1px solid var(--line); padding: 14px;
    }
    .card .nome { font-size: 13px; color: var(--ink); font-weight: bold; margin-bottom: 3px; }
    .card .meta-row { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
    .card .meta-row .tipo { color: var(--ember); }
    .fields { display: flex; gap: 10px; margin-bottom: 10px; }
    .fields .f { flex: 1; }
    .fields label { margin: 0 0 3px; }
    .fields input { padding: 6px 7px; font-size: 13px; }
    .preview {
      font-size: 11px; color: var(--green); background: rgba(79,174,84,.08);
      border: 1px solid rgba(79,174,84,.2); padding: 6px 8px; margin-top: 2px;
      letter-spacing: .5px;
    }
    .preview span { color: var(--ink); opacity: .7; }
    .hint { font-size: 10px; color: var(--muted); margin: 3px 0 0; font-style: italic; }

    .bar {
      position: sticky; bottom: 0; background: rgba(5,5,5,.95); border-top: 1px solid var(--line);
      padding: 14px 18px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-top: 24px;
    }
    .status { font-size: 12px; color: var(--muted); }
    .status.ok { color: var(--green); }
    .status.bad { color: var(--blood); }
    .hide { display: none !important; }
  </style>
</head>
<body>
  <!-- LOGIN -->
  <div id="login">
    <div class="box">
      <h2>ACESSO — APRIMORAMENTOS</h2>
      <form id="loginForm">
        <label for="user">Usuário</label>
        <input type="text" id="user" autocomplete="username" autocapitalize="none" spellcheck="false">
        <label for="pass">Senha</label>
        <input type="password" id="pass" autocomplete="current-password">
        <div class="chk">
          <input type="checkbox" id="remember" checked>
          <label for="remember" style="margin:0;text-transform:none;letter-spacing:0;">Salvar sessão (encriptada) neste aparelho</label>
        </div>
        <div class="err" id="loginErr"></div>
        <button type="submit" style="width:100%;margin-top:6px;">ENTRAR</button>
      </form>
    </div>
  </div>

  <!-- PAINEL -->
  <div id="app" class="hide">
    <header>
      <h1>⚗ CAIPORA — APRIMORAMENTOS DO CACHIMBO</h1>
      <nav>
        <a href="admin.html">Inimigos</a>
        <a href="sequences.html">Sequências</a>
      </nav>
      <button class="ghost" id="logout">SAIR</button>
    </header>
    <div class="wrap">
      <p class="status" id="loadStatus">Carregando…</p>
      <div id="trilhas"></div>
    </div>
    <div class="bar">
      <button id="save" disabled>SALVAR E PUBLICAR</button>
      <span class="status" id="saveStatus"></span>
      <span class="status" style="margin-left:auto;" id="versionTag"></span>
    </div>
  </div>

  <script>
    const ENDPOINT = "https://mlykeulezzfwljriytuf.supabase.co/functions/v1/caipora-api";
    const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1seWtldWxlenpmd2xqcml5dHVmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyNTIzMTksImV4cCI6MjA5NTgyODMxOX0.i9jQGbtQrxbcyR4M-XNZpwPYwJ_GcxrP-VE4Gniamqg";
    const ADMIN_USER = "baltz";
    const LS_KEY = "caipora_admin_hash";

    // Ervas do cachimbo: ordem canônica e defaults de UPGRADE_DEFS.
    // fragment_cost e value são editáveis; o resto é só exibição.
    // value = incremento POR ERVA (não acumulado). Ex: forca tier 1-4 = +1 dano cada.
    const UPGRADES = [
      // Trilha Fúria (dano)
      { key:"forca",   nome:"Folha-Brasa",       trilha:"Fúria",  fase:1, attr:"Dano", fragment_cost:5,  value:1 },
      { key:"forca_2", nome:"Cinza-Viva",         trilha:"Fúria",  fase:2, attr:"Dano", fragment_cost:10, value:1 },
      { key:"forca_3", nome:"Raiz-de-Ira",        trilha:"Fúria",  fase:3, attr:"Dano", fragment_cost:16, value:1 },
      { key:"forca_4", nome:"Breu-Ancestral",      trilha:"Fúria",  fase:4, attr:"Dano", fragment_cost:24, value:1 },
      { key:"forca_5", nome:"Osso-Quebrado",       trilha:"Fúria",  fase:5, attr:"Dano", fragment_cost:36, value:2 },
      { key:"forca_6", nome:"Chaga-da-Mata",       trilha:"Fúria",  fase:6, attr:"Dano", fragment_cost:50, value:2 },
      // Trilha Cura (HP)
      { key:"saude",   nome:"Seiva-Mãe",           trilha:"Cura",   fase:1, attr:"HP",   fragment_cost:6,  value:2 },
      { key:"saude_2", nome:"Casca-Boa",           trilha:"Cura",   fase:2, attr:"HP",   fragment_cost:12, value:3 },
      { key:"saude_3", nome:"Folha-de-Sangue",     trilha:"Cura",   fase:3, attr:"HP",   fragment_cost:20, value:3 },
      { key:"saude_4", nome:"Coração-de-Cerne",    trilha:"Cura",   fase:4, attr:"HP",   fragment_cost:30, value:4 },
      { key:"saude_5", nome:"Rachadura-Viva",      trilha:"Cura",   fase:5, attr:"HP",   fragment_cost:42, value:4 },
      { key:"saude_6", nome:"Pele-de-Defunto",     trilha:"Cura",   fase:6, attr:"HP",   fragment_cost:58, value:5 },
    ];

    // BASE_DAMAGE = 1, CAIPORA_MAX_HEALTH = 2 (espelham Constants.gd)
    const BASE_DAMAGE = 1;
    const BASE_HP = 2;
    const FURIA_KEYS = ["forca","forca_2","forca_3","forca_4","forca_5","forca_6"];
    const CURA_KEYS  = ["saude","saude_2","saude_3","saude_4","saude_5","saude_6"];

    // Computa o efeito acumulado na trilha até esta erva (inclusive), dado os valores atuais dos inputs.
    function effectPreview(key, currentValues) {
      const u = UPGRADES.find(x => x.key === key);
      if (!u) return "";
      const isFuria = u.trilha === "Fúria";
      const keys = isFuria ? FURIA_KEYS : CURA_KEYS;
      const base  = isFuria ? BASE_DAMAGE : BASE_HP;
      let cumul = 0;
      for (const k of keys) {
        const entry = UPGRADES.find(x => x.key === k);
        const cv = currentValues[k];
        const val = cv != null ? Number(cv.value) || 0 : entry.value;
        cumul += val;
        if (k === key) break;
      }
      const total = base + cumul;
      const inc   = currentValues[key] != null ? Number(currentValues[key].value) || 0 : u.value;
      return isFuria
        ? `+${inc} dano/hit → total ${total} dano`
        : `+${inc} HP → total ${total} HP`;
    }

    let sessionHash = null;

    async function sha256hex(s) {
      const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
      return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
    }

    async function api(action, extra) {
      const res = await fetch(ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + ANON, "apikey": ANON },
        body: JSON.stringify(Object.assign({ action }, extra || {})),
      });
      const data = await res.json().catch(() => ({}));
      return { ok: res.ok, status: res.status, data };
    }

    // ---- login ----
    function showApp() {
      document.getElementById("login").classList.add("hide");
      document.getElementById("app").classList.remove("hide");
      loadUpgrades();
    }
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const err = document.getElementById("loginErr");
      err.textContent = "";
      const user = document.getElementById("user").value.trim();
      const pass = document.getElementById("pass").value;
      if (user !== ADMIN_USER) { err.textContent = "Usuário ou senha inválidos."; return; }
      sessionHash = await sha256hex(pass);
      if (document.getElementById("remember").checked) localStorage.setItem(LS_KEY, sessionHash);
      showApp();
    });
    document.getElementById("logout").addEventListener("click", () => {
      localStorage.removeItem(LS_KEY); location.reload();
    });

    // currentValues: { key -> { fragment_cost, value } } — estado vivo dos inputs
    let currentValues = {};

    function updateAllPreviews() {
      for (const u of UPGRADES) {
        const el = document.getElementById("preview_" + u.key);
        if (el) el.textContent = effectPreview(u.key, currentValues);
      }
    }

    // ---- cards ----
    function render(values) {
      currentValues = {};
      for (const u of UPGRADES) {
        const sv = values[u.key] || {};
        currentValues[u.key] = {
          fragment_cost: sv.fragment_cost != null ? sv.fragment_cost : u.fragment_cost,
          value: sv.value != null ? sv.value : u.value,
        };
      }

      const trilhas = {};
      for (const u of UPGRADES) (trilhas[u.trilha] = trilhas[u.trilha] || []).push(u);
      const host = document.getElementById("trilhas");
      host.innerHTML = "";

      const attrHint = { "Fúria": "incremento de dano por hit (não é o total — é o +N desta erva)", "Cura": "incremento de HP máximo (não é o total — é o +N desta erva)" };

      for (const trilha of ["Fúria", "Cura"]) {
        if (!trilhas[trilha]) continue;
        const h = document.createElement("h2");
        h.className = "trilha-title";
        h.textContent = "TRILHA — " + trilha.toUpperCase();
        host.appendChild(h);
        const grid = document.createElement("div");
        grid.className = "grid";
        for (const u of trilhas[trilha]) {
          const cv = currentValues[u.key];
          const card = document.createElement("div");
          card.className = "card";
          card.innerHTML =
            '<div class="nome">' + u.nome + '</div>' +
            '<div class="meta-row">fase ' + u.fase + ' · <span class="tipo">' + u.trilha + '</span></div>' +
            '<div class="fields">' +
              '<div class="f">' +
                '<label>Custo (Terra Rara)</label>' +
                '<input type="number" min="1" step="1" data-key="' + u.key + '" data-field="fragment_cost" value="' + cv.fragment_cost + '">' +
                '<div class="hint">Terra Rara que o jogador paga</div>' +
              '</div>' +
              '<div class="f">' +
                '<label>+' + u.attr + ' por erva</label>' +
                '<input type="number" min="1" step="1" data-key="' + u.key + '" data-field="value" value="' + cv.value + '">' +
                '<div class="hint">' + attrHint[trilha] + '</div>' +
              '</div>' +
            '</div>' +
            '<div class="preview" id="preview_' + u.key + '">' + effectPreview(u.key, currentValues) + '</div>';
          grid.appendChild(card);
        }
        host.appendChild(grid);
      }

      // live preview ao editar qualquer input
      host.addEventListener("input", (e) => {
        const el = e.target;
        if (!el.dataset.key) return;
        const k = el.dataset.key, f = el.dataset.field;
        if (!currentValues[k]) currentValues[k] = {};
        currentValues[k][f] = Number(el.value) || 0;
        updateAllPreviews();
        document.getElementById("save").disabled = false;
      });
    }

    async function loadUpgrades() {
      const status = document.getElementById("loadStatus");
      const r = await api("get_upgrades");
      if (!r.ok) { status.textContent = "Falha ao carregar (" + r.status + ")."; status.className = "status bad"; return; }
      render(r.data.data || {});
      status.classList.add("hide");
      document.getElementById("versionTag").textContent = "versão atual: " + (r.data.version ?? "?");
      document.getElementById("save").disabled = false;
    }

    function collect() {
      const data = {};
      document.querySelectorAll("input[data-key]").forEach((el) => {
        const k = el.dataset.key;
        data[k] = data[k] || {};
        data[k][el.dataset.field] = el.value.trim() === "" ? NaN : Number(el.value);
      });
      return data;
    }

    document.getElementById("save").addEventListener("click", async () => {
      const st = document.getElementById("saveStatus");
      const btn = document.getElementById("save");
      const data = collect();
      if (Object.keys(data).length === 0) {
        st.textContent = "Nenhum dado carregado — recarregue a página."; st.className = "status bad"; return;
      }
      for (const k in data) {
        if (!(data[k].fragment_cost >= 1)) { st.textContent = "Custo inválido em " + k + " (mínimo 1)."; st.className = "status bad"; return; }
        if (!(data[k].value >= 1)) { st.textContent = "Valor inválido em " + k + " (mínimo 1)."; st.className = "status bad"; return; }
      }
      btn.disabled = true; st.textContent = "Salvando…"; st.className = "status";
      try {
        const r = await api("set_upgrades", { admin_pass_hash: sessionHash, data });
        btn.disabled = false;
        if (r.status === 401) {
          st.textContent = "Senha incorreta — faça login de novo."; st.className = "status bad";
          localStorage.removeItem(LS_KEY); return;
        }
        if (!r.ok) { st.textContent = "Erro: " + (r.data.error || r.status); st.className = "status bad"; return; }
        st.textContent = "Publicado! Os jogadores verão o banner de atualização no próximo boot."; st.className = "status ok";
        document.getElementById("versionTag").textContent = "versão atual: " + r.data.version;
      } catch (_err) {
        btn.disabled = false;
        st.textContent = "Erro de rede — verifique a conexão e tente de novo."; st.className = "status bad";
      }
    });

    // sessão salva?
    (function boot() {
      const saved = localStorage.getItem(LS_KEY);
      if (saved) { sessionHash = saved; showApp(); }
    })();
  </script>
</body>
</html>
