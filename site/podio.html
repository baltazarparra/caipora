<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caipora — Pódio</title>
  <meta name="description" content="Ranking global de runs completas — menores tempos de quem enfrentou a floresta.">
  <meta name="theme-color" content="#050505">
  <link rel="icon" type="image/png" href="assets/sprites/brand_mark.png">
  <link rel="stylesheet" href="css/main.css">
  <style>
    /* ── Seção do ranking ────────────────────────────────────── */
    .podio-section {
      min-height: calc(100dvh - var(--nav-height));
      padding: calc(var(--nav-height) + 4rem) 1.5rem 6rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .podio-inner {
      width: 100%;
      max-width: 680px;
    }

    .podio-heading {
      text-align: center;
      margin-bottom: 3rem;
    }

    .podio-tag {
      display: inline-block;
      font-family: var(--font-body);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent-flame);
      margin-bottom: 1rem;
    }

    .podio-title {
      font-family: var(--font-display);
      font-size: clamp(0.85rem, 3vw, 1.1rem);
      color: var(--text-primary);
      margin: 0 0 0.75rem;
      letter-spacing: 0.04em;
      line-height: 1.5;
    }

    .podio-subtitle {
      font-family: var(--font-body);
      font-size: 0.9rem;
      color: var(--text-muted);
      margin: 0;
    }

    /* ── Tabela ──────────────────────────────────────────────── */
    .rank-wrap {
      background: var(--bg-card);
      border: 1px solid rgba(255,69,0,0.12);
      border-radius: 4px;
      overflow: hidden;
    }

    .rank-table {
      width: 100%;
      border-collapse: collapse;
    }

    .rank-table thead {
      background: var(--bg-elevated);
    }

    .rank-table th {
      font-family: var(--font-display);
      font-size: 0.55rem;
      color: var(--text-muted);
      text-align: left;
      padding: 0.8rem 1.25rem;
      letter-spacing: 0.12em;
      border-bottom: 1px solid rgba(255,69,0,0.1);
    }

    .rank-table td {
      padding: 0.9rem 1.25rem;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      vertical-align: middle;
    }

    .rank-table tbody tr:last-child td {
      border-bottom: none;
    }

    .rank-table tbody tr:hover {
      background: rgba(255,69,0,0.04);
    }

    .rank-num {
      width: 52px;
      font-family: var(--font-mono, monospace);
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .initials-cell {
      font-family: var(--font-display);
      font-size: 0.85rem;
      letter-spacing: 0.2em;
      color: var(--text-primary);
    }

    .time-cell {
      font-family: var(--font-mono, monospace);
      font-size: 0.9rem;
      color: var(--text-secondary);
      letter-spacing: 0.06em;
    }

    .date-cell {
      font-family: var(--font-body);
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* 1º lugar em destaque */
    .rank-table tbody tr.first td {
      color: var(--accent-flame);
    }
    .rank-table tbody tr.first .initials-cell {
      color: var(--accent-amber);
    }
    .rank-table tbody tr.first .time-cell {
      color: var(--accent-flame);
    }
    .rank-table tbody tr.first .rank-num {
      color: var(--accent-flame);
    }

    /* ── Estado vazio / carregando ────────────────────────────── */
    .empty-state {
      text-align: center;
      padding: 4rem 1.5rem;
      color: var(--text-muted);
    }

    .empty-state-title {
      font-family: var(--font-display);
      font-size: 0.75rem;
      color: var(--accent-blood);
      margin: 0 0 1rem;
      letter-spacing: 0.08em;
    }

    .empty-state-body {
      font-family: var(--font-body);
      font-size: 0.9rem;
      line-height: 1.6;
      margin: 0;
    }

    /* ── Status de refresh ────────────────────────────────────── */
    .refresh-row {
      text-align: center;
      margin-top: 1.5rem;
      font-family: var(--font-body);
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    #refresh-msg.ok {
      color: var(--accent-crystal);
    }

    /* ── Nav: link ativo ─────────────────────────────────────── */
    .nav-link--active {
      color: var(--accent-flame) !important;
    }

    @media (max-width: 480px) {
      .date-cell,
      .rank-table th.th-date { display: none; }
    }
  </style>
</head>
<body>

  <div class="grain" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>
  <div class="embers" aria-hidden="true"></div>

  <header class="nav" id="nav">
    <div class="nav-inner">
      <a href="index.html" class="nav-brand">
        <img src="assets/sprites/brand_mark.png" alt="" class="nav-brand-icon" width="32" height="32">
        <span class="nav-brand-text">CAIPORA</span>
      </a>
      <nav class="nav-links">
        <a href="index.html#chefes" class="nav-link">Chefes</a>
        <a href="index.html#mecanicas" class="nav-link">Mecânicas</a>
        <a href="podio.html" class="nav-link nav-link--active">Pódio</a>
        <a href="play/" class="btn btn-primary">Jogar</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="podio-section">
      <div class="podio-inner">
        <div class="podio-heading">
          <span class="podio-tag">Ranking</span>
          <h1 class="podio-title">PÓDIO DA FLORESTA</h1>
          <p class="podio-subtitle">Runs completas — ordenadas pelo menor tempo</p>
        </div>

        <div id="board"></div>

        <div class="refresh-row">
          <span id="refresh-msg">atualizando a cada 30s</span>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <p class="footer-tagline">a floresta vive... por enquanto</p>
      <div class="footer-links">
        <a href="podio.html">Pódio</a>
        <a href="https://github.com/baltazarparra/caipora" target="_blank" rel="noopener">GitHub</a>
        <a href="https://baltazarparra.itch.io/caipora" target="_blank" rel="noopener">itch.io</a>
      </div>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script>
    const ENDPOINT = "https://mlykeulezzfwljriytuf.supabase.co/functions/v1/caipora-api";
    const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1seWtldWxlenpmd2xqcml5dHVmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyNTIzMTksImV4cCI6MjA5NTgyODMxOX0.i9jQGbtQrxbcyR4M-XNZpwPYwJ_GcxrP-VE4Gniamqg";

    const api = async (action, extra = {}) => {
      const res = await fetch(ENDPOINT, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + ANON_KEY,
          "apikey": ANON_KEY,
        },
        body: JSON.stringify({ action, ...extra }),
      });
      return res.json();
    };

    const fmtTime = (secs) => {
      const m = Math.floor(secs / 60).toString().padStart(2, "0");
      const s = (secs % 60).toString().padStart(2, "0");
      return m + ":" + s;
    };

    const fmtDate = (iso) => {
      const d = new Date(iso);
      return d.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit", year: "2-digit" });
    };

    const board = document.getElementById("board");
    const refreshMsg = document.getElementById("refresh-msg");

    const render = (podio) => {
      if (!podio || podio.length === 0) {
        board.innerHTML = `
          <div class="rank-wrap">
            <div class="empty-state">
              <p class="empty-state-title">— SEM REGISTROS —</p>
              <p class="empty-state-body">Nenhuma run foi concluída ainda.<br>Complete o jogo para aparecer aqui.</p>
            </div>
          </div>`;
        return;
      }

      const rows = podio.map((entry) => {
        const isFirst = entry.rank === 1;
        return `<tr class="${isFirst ? "first" : ""}">
          <td class="rank-num">${isFirst ? "👑" : "#" + entry.rank}</td>
          <td class="initials-cell">${entry.initials}</td>
          <td class="time-cell">${fmtTime(entry.time_secs)}</td>
          <td class="date-cell">${fmtDate(entry.created_at)}</td>
        </tr>`;
      }).join("");

      board.innerHTML = `
        <div class="rank-wrap">
          <table class="rank-table">
            <thead>
              <tr>
                <th>#</th>
                <th>INICIAIS</th>
                <th>TEMPO</th>
                <th class="th-date">DATA</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>`;
    };

    const load = async () => {
      try {
        const data = await api("get_podio");
        render(data.podio ?? []);
        refreshMsg.textContent = "atualizado • " + new Date().toLocaleTimeString("pt-BR");
        refreshMsg.className = "ok";
        setTimeout(() => { refreshMsg.textContent = "atualizando a cada 30s"; refreshMsg.className = ""; }, 3000);
      } catch (e) {
        refreshMsg.textContent = "erro ao carregar — tentando novamente...";
      }
    };

    load();
    setInterval(load, 30000);
  </script>
</body>
</html>
