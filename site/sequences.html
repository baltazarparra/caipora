<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Caipora — Sequências de Ataque</title>
  <link rel="icon" type="image/png" href="assets/sprites/brand_mark.png">
  <style>
    @font-face {
      font-family: "PressStart2P";
      src: url("assets/fonts/PressStart2P.ttf") format("truetype");
      font-display: swap;
    }
    :root {
      --bg: #050505;
      --panel: #0e0d0d;
      --line: #2a1414;
      --blood: #b41818;
      --ember: #e8731f;
      --ink: #d8cfca;
      --muted: #7e7470;
      --green: #4fae54;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font-family: "Courier New", monospace; line-height: 1.4;
      background-image: radial-gradient(circle at 50% -10%, #1a0808 0%, #050505 60%);
      min-height: 100vh;
    }
    h1, h2, .pix { font-family: "PressStart2P", monospace; }
    a { color: var(--ember); }
    header {
      padding: 22px 18px; border-bottom: 1px solid var(--line);
      display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    }
    header h1 { font-size: 13px; margin: 0; color: var(--blood); letter-spacing: 1px; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 18px; }

    /* ---- login ---- */
    #login {
      position: fixed; inset: 0; background: rgba(5,5,5,.96);
      display: flex; align-items: center; justify-content: center; z-index: 50;
    }
    #login .box {
      width: min(360px, 92vw); background: var(--panel);
      border: 1px solid var(--line); padding: 26px;
    }
    #login h2 { font-size: 12px; color: var(--blood); margin: 0 0 18px; }
    label { display: block; font-size: 11px; color: var(--muted); margin: 12px 0 4px; text-transform: uppercase; letter-spacing: 1px; }
    input[type=text], input[type=password], input[type=number] {
      width: 100%; background: #000; color: var(--ink);
      border: 1px solid var(--line); padding: 8px 9px; font-family: inherit; font-size: 13px;
    }
    input:focus { outline: none; border-color: var(--ember); }
    .chk { display: flex; align-items: center; gap: 8px; margin-top: 14px; color: var(--muted); font-size: 12px; }
    button {
      font-family: "PressStart2P", monospace; font-size: 10px; cursor: pointer;
      background: var(--blood); color: #fff; border: none; padding: 11px 13px; letter-spacing: 1px;
    }
    button:hover { background: var(--ember); }
    button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
    button.ghost:hover { color: var(--ink); border-color: var(--ember); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .err { color: var(--blood); font-size: 12px; margin-top: 12px; min-height: 16px; }

    /* ---- janela de transição global ---- */
    .global-bar {
      background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--ember);
      padding: 14px 16px; margin-bottom: 22px;
      display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap;
    }
    .global-bar .f { width: 160px; }
    .global-bar label { margin: 0 0 4px; }
    .global-bar .desc { flex: 1; min-width: 220px; font-size: 11px; color: var(--muted); }

    /* ---- groups + cards ---- */
    .group-title {
      font-size: 11px; color: var(--ember); margin: 28px 0 10px;
      border-bottom: 1px solid var(--line); padding-bottom: 7px;
      font-family: "PressStart2P", monospace;
    }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
    .card {
      background: var(--panel); border: 1px solid var(--line); padding: 14px;
      text-decoration: none; color: inherit; display: block; transition: border-color .12s;
    }
    .card:hover { border-color: var(--ember); }
    .card .name { font-size: 13px; color: var(--ink); margin-bottom: 6px; }
    .card .meta { font-size: 11px; color: var(--muted); margin-bottom: 10px; }
    .card .meta .tag { color: var(--blood); }
    .card .windows {
      font-size: 10px; color: var(--muted); background: #000;
      padding: 5px 8px; border-left: 2px solid var(--ember); letter-spacing: 0.5px;
    }
    .card .go { font-size: 10px; color: var(--ember); margin-top: 10px; font-family: "PressStart2P", monospace; }

    .status { font-size: 12px; color: var(--muted); }
    .status.ok { color: var(--green); }
    .status.bad { color: var(--blood); }
    .hide { display: none !important; }
  </style>
</head>
<body>
  <!-- LOGIN -->
  <div id="login">
    <div class="box">
      <h2>ACESSO — SEQUÊNCIAS</h2>
      <form id="loginForm">
        <label for="user">Usuário</label>
        <input type="text" id="user" autocomplete="username" autocapitalize="none" spellcheck="false">
        <label for="pass">Senha</label>
        <input type="password" id="pass" autocomplete="current-password">
        <div class="chk">
          <input type="checkbox" id="remember" checked>
          <label for="remember" style="margin:0;text-transform:none;letter-spacing:0;">Salvar sessão (encriptada) neste aparelho</label>
        </div>
        <div class="err" id="loginErr"></div>
        <button type="submit" style="width:100%;margin-top:6px;">ENTRAR</button>
      </form>
    </div>
  </div>

  <!-- PAINEL -->
  <div id="app" class="hide">
    <header>
      <h1>⚔ CAIPORA — SEQUÊNCIAS DE ATAQUE</h1>
      <div style="display:flex;gap:10px;align-items:center;">
        <a href="admin.html" class="ghost" style="font-size:10px;font-family:'PressStart2P',monospace;color:var(--muted);text-decoration:none;">HP/DANO</a>
        <button class="ghost" id="logout">SAIR</button>
      </div>
    </header>
    <div class="wrap">
      <!-- Janela de transição GLOBAL (início do combate → primeiro turno) -->
      <div class="global-bar">
        <div class="f">
          <label>Janela de transição (s)</label>
          <input type="number" id="transition" min="0" step="0.05">
        </div>
        <button id="saveGlobal" disabled>SALVAR GLOBAL</button>
        <div class="desc">
          Tempo padronizado entre o anúncio "Pelejar" e o primeiro turno. Vale para
          todos os combates. <span id="globalStatus" class="status"></span>
        </div>
      </div>

      <p class="status" id="loadStatus">Carregando…</p>
      <div id="groups"></div>
      <p class="status" id="versionTag" style="margin-top:18px;"></p>
    </div>
  </div>

  <script src="js/sequences_shared.js"></script>
  <script>
    let sessionHash = null;
    let serverData = {};

    // ---- login ----
    function showApp() {
      document.getElementById("login").classList.add("hide");
      document.getElementById("app").classList.remove("hide");
      loadPatterns();
    }
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const err = document.getElementById("loginErr");
      err.textContent = "";
      const user = document.getElementById("user").value.trim();
      const pass = document.getElementById("pass").value;
      if (user !== ADMIN_USER) { err.textContent = "Usuário ou senha inválidos."; return; }
      sessionHash = await sha256hex(pass);
      if (document.getElementById("remember").checked) localStorage.setItem(LS_KEY, sessionHash);
      showApp();
    });
    document.getElementById("logout").addEventListener("click", () => {
      localStorage.removeItem(LS_KEY); location.reload();
    });

    // ---- cards ----
    function render() {
      const groups = {};
      for (const p of PATTERNS) (groups[p.group] = groups[p.group] || []).push(p);
      const host = document.getElementById("groups");
      host.innerHTML = "";

      for (const groupName of Object.keys(groups)) {
        const h = document.createElement("h2");
        h.className = "group-title";
        h.textContent = groupName.toUpperCase();
        host.appendChild(h);

        const grid = document.createElement("div");
        grid.className = "grid";

        for (const p of groups[groupName]) {
          const e = resolveEntry(p, serverData[p.key]);
          const card = document.createElement("a");
          card.className = "card";
          card.href = "sequence.html?key=" + encodeURIComponent(p.key);

          const name = document.createElement("div");
          name.className = "name";
          name.textContent = e.label;
          card.appendChild(name);

          const meta = document.createElement("div");
          meta.className = "meta";
          const special = e.is_special ? ' · <span class="tag">defesa ' + e.input_sequence.map((d) => DIR_GLYPH[d] || "?").join("") + "</span>" : "";
          meta.innerHTML = e.strike_count + (e.strike_count > 1 ? " golpes" : " golpe") + special;
          card.appendChild(meta);

          const win = document.createElement("div");
          win.className = "windows";
          win.textContent = PHASES.map((ph) => "P" + ph + ":" + Number(e.action_windows[String(ph)]).toFixed(2) + "s").join(" · ");
          card.appendChild(win);

          const go = document.createElement("div");
          go.className = "go";
          go.textContent = "EDITAR ▸";
          card.appendChild(go);

          grid.appendChild(card);
        }
        host.appendChild(grid);
      }
    }

    async function loadPatterns() {
      const status = document.getElementById("loadStatus");
      const r = await api("get_attack_patterns");
      if (!r.ok) { status.textContent = "Falha ao carregar (" + r.status + ")."; status.className = "status bad"; return; }
      serverData = r.data.data || {};
      const tw = (serverData.__global__ && Number.isFinite(Number(serverData.__global__.transition_window)))
        ? Number(serverData.__global__.transition_window) : TRANSITION_DEFAULT;
      document.getElementById("transition").value = tw;
      render();
      status.classList.add("hide");
      document.getElementById("versionTag").textContent = "versão atual: " + (r.data.version ?? "?");
      document.getElementById("saveGlobal").disabled = false;
    }

    // ---- salvar janela de transição global ----
    document.getElementById("saveGlobal").addEventListener("click", async () => {
      const st = document.getElementById("globalStatus");
      const btn = document.getElementById("saveGlobal");
      const tw = Number(document.getElementById("transition").value);
      if (!Number.isFinite(tw) || tw < 0) { st.textContent = "Valor inválido."; st.className = "status bad"; return; }
      btn.disabled = true; st.textContent = "Salvando…"; st.className = "status";
      try {
        const cur = await api("get_attack_patterns");
        const data = (cur.data && cur.data.data) || {};
        data.__global__ = Object.assign({}, data.__global__, { transition_window: tw });
        const r = await api("set_attack_patterns", { admin_pass_hash: sessionHash, data });
        btn.disabled = false;
        if (r.status === 401) { st.textContent = "Senha incorreta — faça login de novo."; st.className = "status bad"; localStorage.removeItem(LS_KEY); return; }
        if (!r.ok) { st.textContent = "Erro: " + (r.data.error || r.status); st.className = "status bad"; return; }
        serverData = data;
        st.textContent = "Publicado! (versão " + r.data.version + ")"; st.className = "status ok";
      } catch (_err) {
        btn.disabled = false;
        st.textContent = "Erro de rede — tente de novo."; st.className = "status bad";
      }
    });

    // sessão salva?
    (function boot() {
      const saved = localStorage.getItem(LS_KEY);
      if (saved) { sessionHash = saved; showApp(); }
    })();
  </script>
</body>
</html>
